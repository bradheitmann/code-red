<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Code Red: change the route, preserve the result</title>
  <desc id="desc">An execution lead reaches a blocked dependency. An independent inversion analyst tests removing that dependency and rejoins the same verifiable outcome. Existing work continues without interruption.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#243039" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6fe0c7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="500" rx="20" fill="#10191f"/>
  <rect width="1200" height="500" rx="20" fill="url(#grid)" opacity="0.55"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="55" y="64" fill="#ff7883" font-size="18" letter-spacing="4">CODE RED</text>
    <text x="1145" y="64" text-anchor="end" fill="#a8bcc8" font-size="14" letter-spacing="2">2 LEADS / 1 OBJECTIVE / 4 HOURS / 1H CHECKPOINT</text>
    <path d="M55 90H1145" stroke="#384651"/>
    <path d="M270 208H500 M700 208H915" stroke="#647480" stroke-width="3" stroke-dasharray="7 7"/>
    <rect x="55" y="158" width="215" height="100" rx="10" fill="#222c44" stroke="#9aa9ff"/>
    <text x="80" y="197" fill="#c5ceff" font-size="19">A / EXECUTE</text>
    <text x="80" y="229" fill="#a8bcc8" font-size="14">Bounded worker waves</text>
    <rect x="500" y="158" width="200" height="100" rx="10" fill="#3c222c" stroke="#ff7883"/>
    <text x="600" y="198" text-anchor="middle" fill="#ffb2b8" font-size="18">BLOCKED</text>
    <text x="600" y="230" text-anchor="middle" fill="#ffb2b8" font-size="14">DEPENDENCY</text>
    <path d="M600 158C600 106 758 106 758 165" fill="none" stroke="#ff7883" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="820" y="140" fill="#a8bcc8" font-size="13">More of the same?</text>
    <path d="M270 208C330 208 305 350 385 350H790C860 350 840 208 915 208" fill="none" stroke="#6fe0c7" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="385" y="307" width="405" height="86" rx="10" fill="#193c3b" stroke="#6fe0c7"/>
    <text x="410" y="342" fill="#a3f5e2" font-size="19">B / INVERT + EXPERIMENT</text>
    <text x="410" y="371" fill="#d1eee5" font-size="14">Can the dependency disappear?</text>
    <rect x="925" y="158" width="220" height="100" rx="10" fill="#243c2c" stroke="#92d99b"/>
    <text x="1035" y="198" text-anchor="middle" fill="#c0efc6" font-size="18">SAME OUTCOME</text>
    <text x="1035" y="230" text-anchor="middle" fill="#c0efc6" font-size="14">Real acceptance test</text>
    <path d="M55 432H1145" stroke="#384651"/>
    <text x="55" y="466" fill="#a8bcc8" font-size="14">CHANGE THE ROUTE. KEEP THE STANDARD.</text>
    <text x="1145" y="466" text-anchor="end" fill="#a8bcc8" font-size="14">EXISTING WORK CONTINUES.</text>
  </g>
</svg>
